<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI ATLAS — Discover AI</title>

<style>
:root{
    --bg:#050505;
    --bg2:#0a0a0a;
    --card:#101010;
    --card2:#151515;
    --text:#f5f5f5;
    --muted:#999;
    --red:#ff1744;
    --red2:#ff0033;
    --border:#292929;
    --white:#fff;
    --shadow:0 25px 80px rgba(0,0,0,.55);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 20% 0%,rgba(255,23,68,.12),transparent 30%),
        radial-gradient(circle at 80% 20%,rgba(255,255,255,.04),transparent 25%),
        var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.035;
    background-image:
        linear-gradient(rgba(255,255,255,.4) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.4) 1px,transparent 1px);
    background-size:45px 45px;
    mask-image:linear-gradient(to bottom,black,transparent);
}

a{
    color:inherit;
    text-decoration:none;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.container{
    width:min(1400px,92%);
    margin:auto;
}

/* NAV */

nav{
    position:sticky;
    top:0;
    z-index:1000;
    backdrop-filter:blur(20px);
    background:rgba(5,5,5,.78);
    border-bottom:1px solid var(--border);
}

.nav-inner{
    min-height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:21px;
    font-weight:900;
    letter-spacing:2px;
}

.logo-mark{
    width:34px;
    height:34px;
    display:grid;
    place-items:center;
    background:var(--red);
    color:white;
    border-radius:9px;
    box-shadow:0 0 30px rgba(255,23,68,.35);
}

.nav-links{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.nav-links a,
.nav-links button{
    color:#aaa;
    background:none;
    border:0;
    padding:10px 12px;
    border-radius:8px;
    transition:.25s;
}

.nav-links a:hover,
.nav-links button:hover{
    color:white;
    background:#161616;
}

.theme-btn{
    border:1px solid var(--border)!important;
}

/* HERO */

.hero{
    min-height:620px;
    display:grid;
    place-items:center;
    text-align:center;
    position:relative;
    padding:100px 0 80px;
}

.hero::after{
    content:"";
    position:absolute;
    width:420px;
    height:420px;
    background:var(--red);
    filter:blur(180px);
    opacity:.08;
    border-radius:50%;
    z-index:-1;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 14px;
    border:1px solid #333;
    border-radius:999px;
    color:#bbb;
    background:#0d0d0d;
    font-size:13px;
    margin-bottom:25px;
    animation:fadeUp .7s ease both;
}

.badge span{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--red);
    box-shadow:0 0 12px var(--red);
}

.hero h1{
    font-size:clamp(60px,10vw,145px);
    line-height:.86;
    letter-spacing:-7px;
    font-weight:1000;
    animation:heroIn 1s ease both;
}

.hero h1 span{
    color:var(--red);
    text-shadow:0 0 40px rgba(255,23,68,.25);
}

.hero p{
    max-width:760px;
    margin:30px auto;
    color:#aaa;
    font-size:18px;
    line-height:1.7;
    animation:fadeUp .9s .15s ease both;
}

.hero-search{
    width:min(760px,100%);
    margin:auto;
    position:relative;
    animation:fadeUp .9s .25s ease both;
}

.hero-search input{
    width:100%;
    padding:20px 25px;
    border-radius:15px;
    border:1px solid #333;
    background:#0c0c0c;
    color:white;
    outline:none;
    font-size:16px;
    transition:.3s;
}

.hero-search input:focus{
    border-color:var(--red);
    box-shadow:0 0 0 4px rgba(255,23,68,.08),0 0 50px rgba(255,23,68,.1);
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-top:50px;
}

.stat{
    border:1px solid var(--border);
    background:rgba(15,15,15,.7);
    padding:22px;
    border-radius:14px;
}

.stat strong{
    display:block;
    font-size:30px;
    margin-bottom:5px;
}

.stat span{
    color:#888;
    font-size:13px;
}

/* SECTION */

section{
    padding:80px 0;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:20px;
    margin-bottom:30px;
}

.section-title h2{
    font-size:42px;
    letter-spacing:-2px;
}

.section-title p{
    color:#888;
    max-width:550px;
    line-height:1.6;
}

/* CATEGORIES */

.categories{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
    margin-bottom:30px;
}

.category{
    border:1px solid var(--border);
    background:#0d0d0d;
    color:#aaa;
    padding:10px 15px;
    border-radius:999px;
    transition:.25s;
}

.category:hover,
.category.active{
    color:white;
    border-color:var(--red);
    background:rgba(255,23,68,.1);
}

/* TASK FINDER */

.finder{
    border:1px solid var(--border);
    background:
        linear-gradient(135deg,rgba(255,23,68,.08),transparent 40%),
        #0c0c0c;
    border-radius:22px;
    padding:30px;
    margin-bottom:50px;
}

.task-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    margin-top:20px;
}

.task{
    padding:17px;
    border:1px solid #292929;
    background:#111;
    border-radius:12px;
    color:#aaa;
    transition:.25s;
}

.task:hover{
    transform:translateY(-3px);
    border-color:var(--red);
    color:white;
}

/* TOOL GRID */

.tools-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.tool-card{
    position:relative;
    background:
        linear-gradient(145deg,rgba(255,255,255,.025),transparent),
        var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:25px;
    overflow:hidden;
    transition:.35s;
    animation:cardIn .55s ease both;
}

.tool-card::before{
    content:"";
    position:absolute;
    inset:-1px;
    background:linear-gradient(120deg,transparent,rgba(255,23,68,.12),transparent);
    transform:translateX(-120%);
    transition:.6s;
}

.tool-card:hover::before{
    transform:translateX(120%);
}

.tool-card:hover{
    transform:translateY(-8px);
    border-color:#444;
    box-shadow:var(--shadow);
}

.tool-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.tool-icon{
    width:58px;
    height:58px;
    display:grid;
    place-items:center;
    border-radius:15px;
    background:#181818;
    border:1px solid #303030;
    font-size:27px;
}

.favorite{
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid #333;
    background:#111;
    color:#888;
}

.favorite.active{
    color:var(--red);
    border-color:var(--red);
}

.tool-card h3{
    margin:20px 0 8px;
    font-size:24px;
}

.tool-card .description{
    color:#999;
    line-height:1.65;
    min-height:78px;
}

.tags{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin:16px 0;
}

.tag{
    font-size:11px;
    padding:6px 9px;
    border-radius:6px;
    background:#181818;
    border:1px solid #292929;
    color:#aaa;
}

.tag.red{
    color:#ff6b86;
    border-color:rgba(255,23,68,.35);
    background:rgba(255,23,68,.08);
}

.card-actions{
    display:flex;
    gap:9px;
    margin-top:20px;
}

.btn{
    flex:1;
    padding:12px 15px;
    border-radius:9px;
    border:1px solid #333;
    background:#161616;
    color:white;
    transition:.25s;
    text-align:center;
}

.btn:hover{
    border-color:#666;
    transform:translateY(-2px);
}

.btn.primary{
    background:var(--red);
    border-color:var(--red);
    font-weight:bold;
}

.btn.primary:hover{
    box-shadow:0 10px 30px rgba(255,23,68,.25);
}

/* PRIVACY */

.warning{
    border:1px solid rgba(255,23,68,.35);
    background:rgba(255,23,68,.06);
    padding:25px;
    border-radius:17px;
    margin-bottom:25px;
}

.warning h3{
    color:#ff5575;
    margin-bottom:8px;
}

.privacy-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.privacy-card{
    padding:22px;
    border:1px solid var(--border);
    background:#0d0d0d;
    border-radius:16px;
}

.risk{
    color:#ff5271;
}

.review{
    color:#ffc857;
}

/* COMPARE */

.compare-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:25px;
}

select{
    width:100%;
    background:#101010;
    color:white;
    border:1px solid #333;
    padding:15px;
    border-radius:10px;
    outline:none;
}

.compare-table{
    width:100%;
    border-collapse:collapse;
    overflow:hidden;
    border:1px solid var(--border);
}

.compare-table th,
.compare-table td{
    padding:17px;
    text-align:left;
    border-bottom:1px solid var(--border);
}

.compare-table th{
    background:#151515;
}

.compare-table td{
    color:#aaa;
}

/* RANKINGS */

.rankings{
    display:grid;
    gap:10px;
}

.rank{
    display:grid;
    grid-template-columns:60px 60px 1fr 100px;
    gap:15px;
    align-items:center;
    padding:17px;
    border:1px solid var(--border);
    background:#0d0d0d;
    border-radius:13px;
}

.rank-number{
    font-size:25px;
    font-weight:900;
    color:#555;
}

.rank-icon{
    width:45px;
    height:45px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:#171717;
}

.rank small{
    color:#888;
}

.score{
    color:#ff5575;
    font-weight:bold;
    text-align:right;
}

/* PROFILE */

.profile-page{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% 0%,var(--aiGlow),transparent 35%),
        var(--bg);
}

.profile-nav{
    border-bottom:1px solid rgba(255,255,255,.1);
}

.profile-container{
    width:min(1200px,92%);
    margin:auto;
}

.profile-hero{
    padding:90px 0 60px;
    position:relative;
}

.profile-back{
    display:inline-flex;
    margin-bottom:35px;
    color:#aaa;
    border:1px solid #333;
    padding:10px 15px;
    border-radius:9px;
}

.profile-back:hover{
    color:white;
    border-color:var(--aiColor);
}

.profile-icon{
    width:110px;
    height:110px;
    display:grid;
    place-items:center;
    font-size:50px;
    border-radius:28px;
    background:
        linear-gradient(145deg,var(--aiGlow),#111);
    border:1px solid var(--aiColor);
    box-shadow:0 0 80px var(--aiGlow);
    margin-bottom:25px;
    animation:profileFloat 4s ease-in-out infinite;
}

.profile-hero h1{
    font-size:clamp(50px,8vw,100px);
    line-height:.9;
    letter-spacing:-5px;
    margin-bottom:20px;
}

.profile-description{
    color:#aaa;
    font-size:19px;
    line-height:1.8;
    max-width:850px;
}

.profile-actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:30px;
}

.profile-btn{
    padding:14px 22px;
    border-radius:10px;
    border:1px solid #333;
    background:#111;
    color:white;
}

.profile-btn.main{
    background:var(--aiColor);
    border-color:var(--aiColor);
    color:white;
    font-weight:bold;
}

.profile-grid{
    display:grid;
    grid-template-columns:1.5fr 1fr;
    gap:20px;
}

.profile-box{
    border:1px solid #292929;
    background:rgba(15,15,15,.8);
    border-radius:20px;
    padding:28px;
}

.profile-box h2{
    margin-bottom:20px;
    font-size:25px;
}

.feature-list{
    display:grid;
    gap:12px;
}

.feature{
    padding:15px;
    border:1px solid #252525;
    background:#111;
    border-radius:10px;
    color:#bbb;
}

.feature strong{
    color:white;
}

.pros-cons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.pros-cons ul{
    list-style:none;
    display:grid;
    gap:10px;
}

.pros-cons li{
    color:#aaa;
    line-height:1.5;
}

.pros-cons li::before{
    margin-right:8px;
}

.pros li::before{
    content:"✓";
    color:#36d399;
}

.cons li::before{
    content:"!";
    color:#ff5575;
}

.score-grid{
    display:grid;
    gap:14px;
}

.score-row{
    display:grid;
    grid-template-columns:100px 1fr 45px;
    align-items:center;
    gap:10px;
    color:#aaa;
}

.score-bar{
    height:7px;
    background:#222;
    border-radius:99px;
    overflow:hidden;
}

.score-fill{
    height:100%;
    width:var(--score);
    background:var(--aiColor);
    border-radius:99px;
    animation:barIn 1.2s ease;
}

.profile-footer{
    margin-top:60px;
    padding:35px 0 70px;
    color:#777;
    border-top:1px solid #222;
}

/* TOAST */

.toast{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%) translateY(100px);
    background:#fff;
    color:#000;
    padding:13px 18px;
    border-radius:9px;
    z-index:9999;
    opacity:0;
    transition:.3s;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* FOOTER */

footer{
    border-top:1px solid var(--border);
    padding:50px 0;
    color:#777;
}

.footer-grid{
    display:grid;
    grid-template-columns:2fr 1fr 1fr;
    gap:40px;
}

footer h3{
    color:white;
    margin-bottom:12px;
}

footer p{
    line-height:1.7;
}

/* ANIMATIONS */

@keyframes heroIn{
    from{
        opacity:0;
        transform:translateY(30px) scale(.96);
    }
    to{
        opacity:1;
        transform:none;
    }
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

@keyframes profileFloat{
    0%,100%{
        transform:translateY(0) rotate(0deg);
    }
    50%{
        transform:translateY(-8px) rotate(2deg);
    }
}

@keyframes barIn{
    from{
        width:0;
    }
}

@media(max-width:1000px){
    .tools-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .task-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .profile-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:700px){
    .nav-links{
        display:none;
    }

    .hero{
        min-height:550px;
    }

    .hero h1{
        letter-spacing:-4px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .tools-grid,
    .privacy-grid{
        grid-template-columns:1fr;
    }

    .task-grid{
        grid-template-columns:1fr 1fr;
    }

    .section-title{
        display:block;
    }

    .section-title h2{
        font-size:34px;
        margin-bottom:10px;
    }

    .compare-box{
        grid-template-columns:1fr;
    }

    .rank{
        grid-template-columns:35px 45px 1fr;
    }

    .score{
        display:none;
    }

    .pros-cons{
        grid-template-columns:1fr;
    }

    .footer-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(text){
    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function getAI(name){
    return AI.find(x=>x.name===name);
}

function getFavorites(){
    return JSON.parse(localStorage.getItem("aiAtlasFavorites") || "[]");
}

function isFavorite(name){
    return getFavorites().includes(name);
}

function toggleFavorite(name){
    let fav=getFavorites();

    if(fav.includes(name)){
        fav=fav.filter(x=>x!==name);
        toast("Removed from favorites");
    }else{
        fav.push(name);
        toast("Added to favorites ⭐");
    }

    localStorage.setItem("aiAtlasFavorites",JSON.stringify(fav));
    renderTools();
}

function toast(message){
    const t=document.getElementById("toast");
    t.textContent=message;
    t.classList.add("show");

    setTimeout(()=>{
        t.classList.remove("show");
    },1800);
}

${escapeHTML(ai.description)}

</p>

</div>


<div class="profile-box">

<h2>🚀 Main Capabilities</h2>

<div class="feature-list">

${ai.features.map((feature,i)=>`

<div class="feature">

<strong>${i+1}.</strong>
${escapeHTML(feature)}

</div>

`).join("")}

</div>

</div>


<div class="profile-box">

<h2>🎯 Best Use Cases</h2>

<div class="feature-list">

<div class="feature">
<strong>Primary use:</strong>
${escapeHTML(ai.best)}
</div>

<div class="feature">
<strong>Category:</strong>
${escapeHTML(ai.category)}
</div>

<div class="feature">
<strong>Ideal users:</strong>
${escapeHTML(ai.who)}
</div>

</div>

</div>


<div class="profile-box">

<h2>⚖ Strengths & Limitations</h2>

<div class="pros-cons">

<div class="pros">

<h3 style="color:#36d399;margin-bottom:14px">
Strengths
</h3>

<ul>

${ai.pros.map(x=>`
<li>${escapeHTML(x)}</li>
`).join("")}

</ul>

</div>


<div class="cons">

<h3 style="color:#ff5575;margin-bottom:14px">
Things to consider
</h3>

<ul>

${ai.cons.map(x=>`
<li>${escapeHTML(x)}</li>
`).join("")}

</ul>

</div>

</div>

</div>


</div>


<div style="display:grid;gap:20px">


<div class="profile-box">

<h2>📊 AI ATLAS Scores</h2>

<div class="score-grid">

${scoreRow("Overall",Math.round(ai.rating*20))}
${scoreRow("Features",Math.min(98,Math.round(ai.rating*20)+2))}
${scoreRow("Ease",Math.min(97,Math.round(ai.rating*19)+5))}
${scoreRow("Value",Math.min(95,Math.round(ai.rating*18)+8))}
${scoreRow("Versatility",Math.min(99,Math.round(ai.rating*20)+3))}

</div>

<p style="color:#666;font-size:12px;margin-top:20px">
AI ATLAS scores are editorial indicators for this project,
not official ratings from the companies.
</p>

</div>


<div class="profile-box">

<h2>🔐 Privacy</h2>

<div class="feature">

<strong>Status:</strong>
${escapeHTML(ai.privacy)}

</div>

<p style="color:#777;line-height:1.7;margin-top:15px">

Always check the AI service's current privacy policy,
data controls, retention policies and terms before sharing
sensitive information.

</p>

</div>


<div class="profile-box">

<h2>👥 Who Should Use It?</h2>

<p style="color:#aaa;line-height:1.8">

${escapeHTML(ai.who)}

</p>

</div>


<div class="profile-box">

<h2>💰 Pricing</h2>

<p style="color:#aaa;line-height:1.8">

${escapeHTML(ai.price)}

</p>

<p style="color:#666;font-size:12px;margin-top:10px">
Pricing and plans can change. Check the official website
for current information.
</p>

</div>

</div>

</div>

</section>


<footer class="profile-footer">

<h3 style="color:white;margin-bottom:10px">
AI ATLAS
</h3>

<p>
Independent AI discovery project.
Information may change as AI products evolve.
Always verify important information with official sources.
</p>

</footer>

</div>

</main>

</div>
`;

}


function scoreRow(name,score){

return `

<div class="score-row">

<span>${name}</span>

<div class="score-bar">

<div
class="score-fill"
style="--score:${score}%">
</div>

</div>

<strong>${score}</strong>

</div>

`;

}


function copyProfileLink(){

navigator.clipboard.writeText(window.location.href);

alert("AI profile link copied!");

}


function toggleProfileFavorite(name){

let fav=getFavorites();

if(fav.includes(name)){
    fav=fav.filter(x=>x!==name);
}else{
    fav.push(name);
}

localStorage.setItem(
"aiAtlasFavorites",
JSON.stringify(fav)
);

renderProfile(name);

}


/* =========================================================
   PRIVACY
========================================================= */

function renderPrivacy(){

const grid=document.getElementById("privacyGrid");

if(!grid)return;

grid.innerHTML=privacyWatch.map(item=>`

<div class="privacy-card">

<h3 class="${item.level==="REVIEW"?"review":"risk"}">

${item.level}

</h3>

<h3 style="margin:10px 0">

${escapeHTML(item.name)}

</h3>

<p style="color:#888;line-height:1.7">

${escapeHTML(item.reason)}

</p>

</div>

`).join("");

}


/* =========================================================
   COMPARE
========================================================= */

function setupCompare(){

const a=document.getElementById("compareA");
const b=document.getElementById("compareB");

if(!a || !b)return;

const options=
`<option value="">Choose an AI...</option>`+
AI.map(x=>`
<option value="${escapeHTML(x.name)}">
${escapeHTML(x.name)}
</option>
`).join("");

a.innerHTML=options;
b.innerHTML=options;

a.addEventListener("change",renderCompare);
b.addEventListener("change",renderCompare);

}


function renderCompare(){

const a=getAI(document.getElementById("compareA").value);
const b=getAI(document.getElementById("compareB").value);

const box=document.getElementById("compareResult");

if(!a || !b){

box.innerHTML="";

return;

}

box.innerHTML=`

<table class="compare-table">

<tr>
<th>Feature</th>
<th>${escapeHTML(a.name)}</th>
<th>${escapeHTML(b.name)}</th>
</tr>

<tr>
<td>Category</td>
<td>${a.category}</td>
<td>${b.category}</td>
</tr>

<tr>
<td>Rating</td>
<td>★ ${a.rating}</td>
<td>★ ${b.rating}</td>
</tr>

<tr>
<td>Pricing</td>
<td>${a.price}</td>
<td>${b.price}</td>
</tr>

<tr>
<td>Best for</td>
<td>${a.best}</td>
<td>${b.best}</td>
</tr>

<tr>
<td>Privacy</td>
<td>${a.privacy}</td>
<td>${b.privacy}</td>
</tr>

<tr>
<td>Official site</td>
<td>
<a
href="${a.url}"
target="_blank"
style="color:#ff5575">
Visit →
</a>
</td>
<td>
<a
href="${b.url}"
target="_blank"
style="color:#ff5575">
Visit →
</a>
</td>
</tr>

</table>

`;

}


/* =========================================================
   RANKINGS
========================================================= */

function renderRankings(){

const box=document.getElementById("rankingsList");

if(!box)return;

const ranked=[...AI]
.sort((a,b)=>b.rating-a.rating)
.slice(0,10);

box.innerHTML=ranked.map((ai,index)=>`

<div class="rank">

<div class="rank-number">
#${index+1}
</div>

<div class="rank-icon">
${ai.icon}
</div>

<div>

<strong>${escapeHTML(ai.name)}</strong>

<br>

<small>
${escapeHTML(ai.category)}
</small>

</div>

<div class="score">
★ ${ai.rating}
</div>

</div>

`).join("");

}


/* =========================================================
   KEYBOARD SEARCH
========================================================= */

document.addEventListener("keydown",e=>{

if(
e.key==="/" &&
document.activeElement.tagName!=="INPUT"
){

e.preventDefault();

const input=document.getElementById("mainSearch");

if(input){
    input.focus();
}

}

});


/* =========================================================
   START
========================================================= */

const params=new URLSearchParams(
window.location.search
);

const requestedAI=params.get("ai");

if(requestedAI){

renderProfile(requestedAI);

}else{

renderDirectory();

}

</script>

</body>
</html>
